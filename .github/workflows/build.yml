name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        run: choco install nasm --yes --no-progress
      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop
      - name: Build NSIS installer
        run: npm --prefix apps/desktop run tauri -- build --bundles nsis --features custom-protocol
      - name: Build portable zip
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/nexuscat.exe portable/
          Copy-Item LICENSE portable/
          Copy-Item README.md portable/
          Copy-Item preview portable/preview -Recurse
          Compress-Archive -Path @('portable/nexuscat.exe', 'portable/LICENSE', 'portable/README.md', 'portable/preview') -DestinationPath "dist/NexusCat-$version-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            dist/*-windows-x64-portable.zip
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install CMake
        run: brew install cmake || true
      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop
      - name: Build app and dmg
        run: npm --prefix apps/desktop run tauri -- build --bundles app,dmg --features custom-protocol
      - name: Package app zip and update pkg
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/NexusCat.app "dist/NexusCat-${VERSION}-macos-arm64.zip"
          pkgbuild \
            --component target/release/bundle/macos/NexusCat.app \
            --install-location /Applications \
            --identifier app.nexuscat.desktop \
            --version "$VERSION" \
            "dist/NexusCat-${VERSION}-macos-arm64.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            target/release/bundle/dmg/*.dmg
            dist/*-macos-arm64.zip
            dist/*-macos-arm64.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build.{1}', steps.version.outputs.version, github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('NexusCat {0}', github.ref_name) || format('NexusCat v{0} build {1}', steps.version.outputs.version, github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.pkg
          generate_release_notes: true
          fail_on_unmatched_files: true
